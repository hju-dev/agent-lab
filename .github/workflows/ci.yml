# Checks every pull request before it can merge (docs/DONE_CHECKS.md, "CI wiring").
# Uses pull_request, never pull_request_target, so code from a PR never sees the repo's secrets.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway Postgres for the database tests, deleted when the job ends. It isn't Neon,
    # so CI needs no database secrets and never wakes Neon. The passwords below only exist here.
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_OWNER_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/postgres
      LAB_PUBLIC_PASSWORD: ci-only-not-a-secret
      LAB_AGENT_PASSWORD: ci-only-not-a-secret
      LAB_ADMIN_PASSWORD: ci-only-not-a-secret
      LAB_PUBLIC_URL: postgresql://lab_public:ci-only-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Apply the migrations to the throwaway database
        run: node scripts/migrate.ts CI_OWNER_URL
      - run: npm test
