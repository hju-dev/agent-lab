# Site Doctor's hourly uptime check (PRD F1, Phase 2). Logs are public: the script prints the run id and counts only.
# Scheduled runs are skipped until Henry sets the repository variable SITE_DOCTOR_ENABLED to true
# (Settings → Secrets and variables → Actions → Variables), after production is migrated and seeded.
# GitHub may start scheduled runs late or skip them (SP3), so this is "about hourly, best effort".
name: site-doctor

on:
  schedule:
    - cron: '37 * * * *' # odd minute (S27), clear of the spike workflows at :17, :23 and :47
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-doctor
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.SITE_DOCTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Site Doctor
        run: node agents/site-doctor/index.ts
        env:
          DATABASE_URL_AGENT: ${{ secrets.DATABASE_URL_AGENT }}
          DATABASE_URL_PUBLIC: ${{ secrets.DATABASE_URL_PUBLIC }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
