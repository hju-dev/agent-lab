# Site Doctor, walking-skeleton version. Manual runs only until the SP3 decision sets the schedule.
# Logs are public: the script prints the run id and counts only.
name: site-doctor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-doctor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Site Doctor
        run: node agents/site-doctor/index.ts
        env:
          DATABASE_URL_AGENT: ${{ secrets.DATABASE_URL_AGENT }}
          DATABASE_URL_PUBLIC: ${{ secrets.DATABASE_URL_PUBLIC }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
