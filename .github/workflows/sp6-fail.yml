# SP6 part 1 (docs/SPIKES.md): does GitHub's failure email for a scheduled run reach Henry's inbox?
# Temporary: fails on purpose every hour at :23, and is deleted once the first email arrives.
# Hourly rather than daily because SP3 showed scheduled runs can be dropped; one email is enough.
name: sp6-fail

on:
  schedule:
    - cron: '23 * * * *'

permissions: {}

concurrency:
  group: sp6-fail
  cancel-in-progress: false

jobs:
  fail:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail on purpose
        run: |
          echo "SP6 part 1: failing on purpose at $(date -u +%FT%TZ) to test the failure email"
          exit 1
